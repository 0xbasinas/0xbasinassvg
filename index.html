<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG to Favicon Bundle - High-Resolution Favicon Generator</title>
    <meta name="description" content="Convert your SVG into a complete high-resolution favicon bundle with ICO, PNG files for all platforms, Apple Touch Icon, Android Chrome icons, and web manifest. Free online tool." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SVG to Favicon Bundle Generator" />
    <meta property="og:description" content="Convert SVG to high-resolution favicons for all platforms. Generate ICO, PNG, Apple Touch Icon, and web manifest in one click." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SVG to Favicon Bundle Generator" />
    <meta name="twitter:description" content="Convert SVG to high-resolution favicons for all platforms. Generate ICO, PNG, Apple Touch Icon, and web manifest in one click." />

    <!-- Add your favicon here -->
    <!-- <link rel="icon" type="image/x-icon" href="/favicon.ico"> -->
    <style>
      /* Critical CSS to prevent flash */
      html {
        background-color: white;
        color-scheme: light;
      }
      html.dark {
        background-color: rgb(23, 23, 23);
        color-scheme: dark;
      }
      body {
        margin: 0;
        background-color: transparent;
      }
    </style>
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('theme');
          const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          const appliedTheme = theme === 'system' || !theme ? systemTheme : theme;

          if (appliedTheme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
